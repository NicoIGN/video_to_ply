name: gsplat

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pip

  # Utilities
  - rclone
  - tree
  - tqdm

  # Build tools
  - cmake
  - ninja

  # PyTorch + CUDA
  - pytorch=2.3.1
  - torchvision=0.18.1
  - torchaudio=2.3.1
  - pytorch-cuda=12.1

  # Scientific stack
  - numpy<2
  - scipy

  # IO / Media
  - openimageio
  - ffmpeg
  - imageio
  - imageio-ffmpeg

  # Geometry / SfM (IMPORTANT FIX)
  - faiss-cpu
  - plyfile

  - pip:
      - nerfstudio==1.0.3
      - gsplat==0.1.11
      - fpsample
      - git+https://github.com/cvg/Hierarchical-Localization.git
      - colmap-wrapper  # (pip fallback, not conda colmap)
