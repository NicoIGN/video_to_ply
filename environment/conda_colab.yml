name: gsplat
channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - rclone
  - tree

  # 🔧 build tools
  - cmake
  - ninja

  # 🧮 math / core
  - numpy
  - scipy
  - eigen
  - suitesparse

  # 🖼️ vision / IO
  - openimageio
  - ffmpeg
  - imageio
  - imageio-ffmpeg

  # 🧊 geometry / SfM stack
  - "colmap>=3.8,<4.0"
  - pycolmap>=0.6
  - cgal
  - faiss-cpu
  

  # 🖥️ UI (souvent inutile mais requis par colmap)
  - glew
  - qt

  # system utils
  - libiconv

  # ======================
  # PIP SECTION
  # ======================
  - pip:
      # 🔥 ML stack (GPU auto sur Colab)
      - torch
      - torchvision

      # nerfstudio
      - nerfstudio==1.1.5

      # utils
      - tqdm
      - opencv-python
