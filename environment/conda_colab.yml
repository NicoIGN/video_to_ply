name: gsplat
channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - rclone
  - tree
  - bash

  # 🔧 build tools
  - cmake
  - ninja

  # 🧮 math / core
  - numpy
  - scipy
  - eigen
  - suitesparse

  # 🖼️ vision / IO
  - openimageio
  - ffmpeg
  - imageio
  - imageio-ffmpeg

  # 🧊 geometry / SfM stack
  - colmap=3.8  # au dela, incomaptibilité avec nerfstudio
  - hloc
  - cgal
  - faiss-cpu
  - plyfile
#  - pycolmap>=0.6


  # 🖥️ UI (souvent inutile mais requis par colmap)
  - glew
  - qt

  # system utils
  - libiconv

  # ======================
  # PIP SECTION
  # ======================
  - pip:
      # 🔥 ML stack (GPU auto sur Colab)
      - torch==2.5.1
      - torchvision
      - torchaudio

      # nerfstudio
      - nerfstudio==1.1.5

      # utils
      - tqdm
