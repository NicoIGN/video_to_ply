name: gsplat
channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - rclone
  - tree
  - tqdm
  
  # ======================
  # BUILD TOOLS
  # ======================
  - cmake
  - ninja

  # ======================
  # NUMPY / SCIENTIFIC
  # ======================
  - numpy
  - scipy
  - eigen
  - suitesparse
  - fpsample
 
  # ======================
  # IO / MEDIA
  # ======================
  - openimageio
  - ffmpeg
  - imageio
  - imageio-ffmpeg
  - opencv

  # ======================
  # GEOMETRY / SfM CORE
  # ======================
  - colmap=3.8
  - hloc
  - cgal
  - faiss-cpu
  - plyfile

  # ======================
  # GRAPHICS (COLMAP QT FIX)
  # ======================
  - glew
  - qt-main
  - libxcb

  # ======================
  # SYSTEM
  # ======================
  - libiconv

  # ======================
  # PIP SECTION
  # ======================
  - pip:
      # 🔥 PyTorch stack (doit rester pip pour éviter conflits CUDA)
      - torch==2.5.1
      - torchvision
      - torchaudio

      # Nerfstudio + GSPLAT
      - nerfstudio==1.1.5
      - gsplat==1.4.0
      
