name: gsplat

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - rclone
  - tree
  - tqdm

  # ======================
  # BUILD TOOLS
  # ======================
  - cmake
  - ninja

  # ======================
  # PYTORCH STACK
  # Stable with Nerfstudio 1.1.5 + gsplat 1.4.0
  # ======================
  - pytorch=2.3.1
  - torchvision=0.18.1
  - torchaudio=2.3.1
  - pytorch-cuda=12.1

  # ======================
  # NUMPY / SCIENTIFIC
  # ======================
  - numpy<2
  - scipy
  - fpsample

  # ======================
  # NERF / GSPLAT
  # ======================
  - nerfstudio=1.1.5
  - gsplat=1.4.0

  # ======================
  # IO / MEDIA
  # ======================
  - openimageio
  - ffmpeg
  - imageio
  - imageio-ffmpeg
  - opencv

  # ======================
  # GEOMETRY / SfM CORE
  # ======================
  - colmap=3.8
  - faiss-cpu
  - plyfile

  # ======================
  # SYSTEM / GRAPHICS
  # ======================
  - glew
  - qt-main
  - libxcb
  - libiconv

  - pip:
      - git+https://github.com/cvg/Hierarchical-Localization.git
