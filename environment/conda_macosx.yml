name: gsplat
channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - rclone
  - tree
  - bash

  # 🔧 build
  - cmake
  - ninja

  # 🧮 math stable
  - numpy
  - scipy
  - eigen=3
  - suitesparse

  # 🖼️ vision
  - openimageio
  - ffmpeg

  # 🧊 geometry / SfM stack
  - colmap=3.8  # au dela, incomaptibilité avec nerfstudio
  - cgal
  - faiss-cpu
  - plyfile

  # 🖥️ UI
  - glew
  - qt=5

  # system
  - libiconv

  - pip:
      # 🔥 ML stack stable
      - torch==2.2
      - torchvision
      - torchaudio

      # nerfstudio stable
      - nerfstudio==1.1.5

      # COLMAP bindings correct
      - pycolmap

      # utils
      - imageio
      - imageio-ffmpeg
