name: gsplat
channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - rclone

  # 🔧 build
  - cmake
  - ninja

  # 🧮 math stable
  - numpy
  - scipy
  - eigen=3
  - suitesparse

  # 🖼️ vision
  - openimageio
  - ffmpeg

  # 🧊 geometry / SfM stack
  - cgal
  - colmap

  # 🖥️ UI
  - glew
  - qt=5

  # system
  - libiconv

  - pip:
      # 🔥 ML stack stable
      - torch
      - torchvision

      # nerfstudio stable
      - nerfstudio==0.3.4

      # COLMAP bindings correct
      - pycolmap

      # utils
      - imageio
      - imageio-ffmpeg
